name: Local-validation-equivalent CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      # Verified against official refs/tags/v4.3.1 on 2026-11-04.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Packaging parser, fixture and safety checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem tools/*.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          ./tools/test-packaging.ps1
          ./tools/check-safety.ps1
      - run: dotnet restore FlipOverlay.slnx --locked-mode
      - run: dotnet build FlipOverlay.slnx -c Release --no-restore
      - run: dotnet test FlipOverlay.slnx -c Release --no-build --no-restore
      - run: dotnet format FlipOverlay.slnx --verify-no-changes --no-restore
      - run: dotnet run --project src/FlipOverlay.App -c Release --no-build -- --selftest
      - name: Linux UI smoke (not a game overlay test)
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet run --project src/FlipOverlay.App -c Release --no-build -- --ui-smoke
      - name: Windows native UI smoke (not a PoE benchmark)
        if: runner.os == 'Windows'
        run: dotnet run --project src/FlipOverlay.App -c Release --no-build -- --ui-smoke
      - name: Windows setup and portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build.ps1
      - name: Windows portable archive smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          ./tools/verify.ps1 -Archive "artifacts/PoE-Flip-Overlay-$version-portable.zip" -ExpectedVersion $version
# No release, tag, push, deployment, or artifact upload. Publishing needs separate permission.
